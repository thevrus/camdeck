name: Release

# Push a tag like v0.2.0 to build, sign and publish an update that installed apps pick up via Sparkle.
# Run manually (Actions tab) to do a dry run: builds and signs, publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build with the Xcode the app is developed on. The runner defaults to Xcode 26, whose SwiftPM
      # does not write the build layout scripts/bundle.sh reads to generate the Shortcuts metadata.
      - name: Select Xcode 27
        run: |
          XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27 on this runner. Installed: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Test
        run: swift test

      # Signing is optional. Without the DEVELOPER_ID_P12 secrets this step does nothing and the
      # release stays ad-hoc signed, exactly as before. See docs/releasing.md.
      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_P12" ] || [ -z "$DEVELOPER_ID_P12_PASSWORD" ]; then
            echo "::notice title=Unsigned build::DEVELOPER_ID_P12 / DEVELOPER_ID_P12_PASSWORD not set. Skipping Developer ID signing and notarization; this release will be ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::The P12 contains no 'Developer ID Application' identity"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Imported signing identity: $IDENTITY"

      - name: Build app
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dryrun"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" BUILD="$(git rev-list --count HEAD)" make app

      # Re-signs with Developer ID + hardened runtime. Skips with a log line when SIGN_IDENTITY is unset.
      # Must run before the zip so Sparkle's update archive contains the signed app.
      - name: Sign app
        run: scripts/sign-notarize.sh app

      - name: Package zip and dmg
        run: |
          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent build/Camdeck.app "build/release/Camdeck-$VERSION.zip"
          scripts/make-dmg.sh build/Camdeck.dmg   # outside build/release so Sparkle's appcast ignores it

      # Signs the dmg, submits it to Apple, waits, staples. Skips with a log line without the notary secrets.
      - name: Notarize dmg
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: scripts/sign-notarize.sh dmg

      - name: Print dmg sha256 for the Homebrew cask
        run: |
          SHA="$(shasum -a 256 build/Camdeck.dmg | awk '{print $1}')"
          echo "sha256 \"$SHA\"   # version \"$VERSION\", Camdeck.dmg"
          {
            echo "### Homebrew cask"
            echo
            echo "Update \`packaging/homebrew/camdeck.rb\` in the tap with:"
            echo
            echo '```ruby'
            echo "version \"$VERSION\""
            echo "sha256 \"$SHA\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign update and refresh appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          git fetch origin main
          git show origin/main:appcast.xml > build/release/appcast.xml
          echo "$SPARKLE_ED_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast build/release \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/release/Camdeck-$VERSION.zip" build/Camdeck.dmg --title "Camdeck $VERSION" --generate-notes

      # Last, so the feed never points at a download that does not exist yet.
      - name: Publish appcast
        if: github.ref_type == 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          cp build/release/appcast.xml appcast.xml
          git add appcast.xml
          git commit -m "Release $VERSION"
          git push origin main

      - name: Remove signing keychain
        if: always()
        run: '[ -z "${SIGNING_KEYCHAIN:-}" ] || security delete-keychain "$SIGNING_KEYCHAIN" || true'
